# Lock screen in the Omarchy layout, with the current wallpaper blurred.
# `wallpaper` keeps ~/.cache/wallpaper/current pointed at the active image.

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1b26ff)
    path = ~/.cache/wallpaper/current
    blur_passes = 3
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(1a1b26cc)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    outline_thickness = 4

    font_family = JetBrainsMonoNL Nerd Font Mono
    font_color = rgb(c0caf5)

    placeholder_text = Enter Password
    check_color = rgba(00ff99ee)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}
