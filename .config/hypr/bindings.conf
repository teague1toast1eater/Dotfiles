# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password
bindd = SUPER ALT, D, Discord, exec, omarchy-launch-or-focus ^discord$ "uwsm-app -- discord"
bindd = SUPER SHIFT, S, Steam, exec, omarchy-launch-or-focus ^steam$ "uwsm-app -- steam"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-or-focus ^thunderbird$ "uwsm-app -- thunderbird"
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://claude.ai/login"
bindd = SUPER SHIFT, C, CyberChef, exec, omarchy-launch-webapp "https://gchq.github.io/CyberChef/"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Sync workspace switching across all monitors
# When you switch workspace, both screens jump to the same one.
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
unbind = SUPER, TAB
unbind = SUPER SHIFT, TAB
unbind = SUPER CTRL, TAB
unbind = SUPER, mouse_down
unbind = SUPER, mouse_up

bindd = SUPER, code:10, Switch to workspace 1 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 1
bindd = SUPER, code:11, Switch to workspace 2 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 2
bindd = SUPER, code:12, Switch to workspace 3 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 3
bindd = SUPER, code:13, Switch to workspace 4 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 4
bindd = SUPER, code:14, Switch to workspace 5 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 5
bindd = SUPER, code:15, Switch to workspace 6 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 6
bindd = SUPER, code:16, Switch to workspace 7 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 7
bindd = SUPER, code:17, Switch to workspace 8 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 8
bindd = SUPER, code:18, Switch to workspace 9 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 9
bindd = SUPER, code:19, Switch to workspace 10 (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh 10
bindd = SUPER, TAB, Next workspace (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh e+1
bindd = SUPER SHIFT, TAB, Previous workspace (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh e-1
bindd = SUPER CTRL, TAB, Former workspace (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh previous
bindd = SUPER, mouse_down, Scroll workspace forward (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh e+1
bindd = SUPER, mouse_up, Scroll workspace backward (all monitors), exec, ~/.config/hypr/scripts/switch-workspace-all.sh e-1
